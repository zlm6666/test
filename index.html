<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Zone</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            padding: 2rem;
        }
        .container { text-align: center; max-width: 600px; }
        .badge {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 2rem;
        }
        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .subtitle {
            color: #999;
            font-size: 1.1rem;
            margin-bottom: 3rem;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding-bottom: 2rem;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 360px;
            margin: 0 auto;
        }
        .links a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 24px;
            border-radius: 12px;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            color: #ccc;
            text-decoration: none;
            transition: all 0.25s;
            font-size: 0.95rem;
        }
        .links a:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.18);
            color: #fff;
            transform: translateY(-2px);
        }
        .links a .arrow { color: #555; transition: transform 0.25s; }
        .links a:hover .arrow { transform: translateX(4px); color: #888; }
        .footer { margin-top: 4rem; font-size: 0.8rem; color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <div class="badge">⚡ Test Workspace</div>
        <h1>Test Zone</h1>
        <p class="subtitle">zlm6666 的开发测试靶场</p>
        <div class="links">
            <a href="163music.html">
                <span>🎵 网易云音乐解析</span>
                <span class="arrow">→</span>
            </a>
        </div>
        <div class="footer">xiao · managed by ima.copilot</div>
    </div>
</body>
</html>
